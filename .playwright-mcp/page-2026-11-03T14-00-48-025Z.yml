                - paragraph [ref=f7e195]:
                  - text: Computer vision, and object recognition in particular, has made tremendous advances in the past few years. The PASCAL VOC Challenge (Everingham et al.,
                  - link "2010" [ref=f7e196] [cursor=pointer]:
                    - /url: "#B6"
                  - text: ), and more recently the Large Scale Visual Recognition Challenge (ILSVRC) (Russakovsky et al.,
                  - link "2015" [ref=f7e197] [cursor=pointer]:
                    - /url: "#B24"
                  - text: ) based on the ImageNet dataset (Deng et al.,
                  - link "2009" [ref=f7e198] [cursor=pointer]:
                    - /url: "#B4"
                  - text: ) have been widely used as benchmarks for numerous visualization-related problems in computer vision, including object classification. In 2012, a large, deep convolutional neural network achieved a top-5 error of 16.4% for the classification of images into 1000 possible categories (Krizhevsky et al.,
                  - link "2012" [ref=f7e199] [cursor=pointer]:
                    - /url: "#B16"
                  - text: ). In the following 3 years, various advances in deep convolutional neural networks lowered the error rate to 3.57% (Krizhevsky et al.,
                  - link "2012" [ref=f7e200] [cursor=pointer]:
                    - /url: "#B16"
                  - text: ; Simonyan and Zisserman,
                  - link "2014" [ref=f7e201] [cursor=pointer]:
                    - /url: "#B28"
                  - text: ; Zeiler and Fergus,
                  - link "2014" [ref=f7e202] [cursor=pointer]:
                    - /url: "#B35"
                  - text: ; He et al.,
                  - link "2015" [ref=f7e203] [cursor=pointer]:
                    - /url: "#B10"
                  - text: ; Szegedy et al.,
                  - link "2015" [ref=f7e204] [cursor=pointer]:
                    - /url: "#B31"
                  - text: ). While training large neural networks can be very time-consuming, the trained models can classify images very quickly, which makes them also suitable for consumer applications on smartphones.
                - paragraph [ref=f7e205]:
                  - text: Deep neural networks have recently been successfully applied in many diverse domains as examples of end to end learning. Neural networks provide a mapping between an input—such as an image of a diseased plant—to an output—such as a crop~disease pair. The nodes in a neural network are mathematical functions that take numerical inputs from the incoming edges, and provide a numerical output as an outgoing edge. Deep neural networks are simply mapping the input layer to the output layer over a series of stacked layers of nodes. The challenge is to create a deep network in such a way that both the structure of the network as well as the functions (nodes) and edge weights correctly map the input to the output. Deep neural networks are trained by tuning the network parameters in such a way that the mapping improves during the training process. This process is computationally challenging and has in recent times been improved dramatically by a number of both conceptual and engineering breakthroughs (LeCun et al.,
                  - link "2015" [ref=f7e206] [cursor=pointer]:
                    - /url: "#B18"
                  - text: ; Schmidhuber,
                  - link "2015" [ref=f7e207] [cursor=pointer]:
                    - /url: "#B27"
                  - text: ).
                - paragraph [ref=f7e208]:
                  - text: In order to develop accurate image classifiers for the purposes of plant disease diagnosis, we needed a large, verified dataset of images of diseased and healthy plants. Until very recently, such a dataset did not exist, and even smaller datasets were not freely available. To address this problem, the PlantVillage project has begun collecting tens of thousands of images of healthy and diseased crop plants (Hughes and Salathé,
                  - link "2015" [ref=f7e209] [cursor=pointer]:
                    - /url: "#B13"
                  - text: ), and has made them openly and freely available. Here, we report on the classification of 26 diseases in 14 crop species using 54,306 images with a convolutional neural network approach. We measure the performance of our models based on their ability to predict the correct crop-diseases pair, given 38 possible classes. The best performing model achieves a mean F
                  - subscript [ref=f7e210]: "1"
                  - text: score of 0.9934 (overall accuracy of 99.35%), hence demonstrating the technical feasibility of our approach. Our results are a first step toward a smartphone-assisted plant disease diagnosis system.
              - generic [ref=f7e211]:
                - heading "Methods" [level=2] [ref=f7e212]
                - generic [ref=f7e213]:
                  - heading "Dataset description" [level=3] [ref=f7e214]
                  - paragraph [ref=f7e215]:
                    - text: We analyze 54,306 images of plant leaves, which have a spread of 38 class labels assigned to them. Each class label is a crop-disease pair, and we make an attempt to predict the crop-disease pair given just the image of the plant leaf. Figure
                    - link "1" [ref=f7e216] [cursor=pointer]:
                      - /url: "#F1"
                    - text: shows one example each from every crop-disease pair from the PlantVillage dataset. In all the approaches described in this paper, we resize the images to 256 × 256 pixels, and we perform both the model optimization and predictions on these downscaled images.
                  - paragraph [ref=f7e217]: Across all our experiments, we use three different versions of the whole PlantVillage dataset. We start with the PlantVillage dataset as it is, in color; then we experiment with a gray-scaled version of the PlantVillage dataset, and finally we run all the experiments on a version of the PlantVillage dataset where the leaves were segmented, hence removing all the extra background information which might have the potential to introduce some inherent bias in the dataset due to the regularized process of data collection in case of PlantVillage dataset. Segmentation was automated by the means of a script tuned to perform well on our particular dataset. We chose a technique based on a set of masks generated by analysis of the color, lightness and saturation components of different parts of the images in several color spaces (Lab and HSB). One of the steps of that processing also allowed us to easily fix color casts, which happened to be very strong in some of the subsets of the dataset, thus removing another potential bias.
                  - paragraph [ref=f7e218]:
                    - text: This set of experiments was designed to understand if the neural network actually learns the “notion” of plant diseases, or if it is just learning the inherent biases in the dataset. Figure
                    - link "2" [ref=f7e219] [cursor=pointer]:
                      - /url: "#F2"
                    - text: shows the different versions of the same leaf for a randomly selected set of leaves.
                  - figure [ref=f7e220]:
                    - heading "Figure 2." [level=4] [ref=f7e221]
                    - paragraph [ref=f7e222]:
                      - link [ref=f7e223] [cursor=pointer]:
                        - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=5032846_fpls-07-01419-g0002.jpg
                        - img "Figure 2" [ref=f7e224]
                        - text: 🔍
                    - link "Open in a new tab" [ref=f7e226] [cursor=pointer]:
                      - /url: figure/F2/
                    - paragraph [ref=f7e228]:
                      - strong [ref=f7e229]: Sample images from the three different versions of the PlantVillage dataset used in various experimental configurations. (A)
                      - text: Leaf 1 color,
