            - generic [ref=f7e101]:
              - generic [ref=f7e102]:
                - heading "Abstract" [level=2] [ref=f7e103]
                - paragraph [ref=f7e104]: Crop diseases are a major threat to food security, but their rapid identification remains difficult in many parts of the world due to the lack of the necessary infrastructure. The combination of increasing global smartphone penetration and recent advances in computer vision made possible by deep learning has paved the way for smartphone-assisted disease diagnosis. Using a public dataset of 54,306 images of diseased and healthy plant leaves collected under controlled conditions, we train a deep convolutional neural network to identify 14 crop species and 26 diseases (or absence thereof). The trained model achieves an accuracy of 99.35% on a held-out test set, demonstrating the feasibility of this approach. Overall, the approach of training deep learning models on increasingly large and publicly available image datasets presents a clear path toward smartphone-assisted crop disease diagnosis on a massive global scale.
                - paragraph [ref=f7e106]:
                  - strong [ref=f7e107]: "Keywords:"
                  - text: crop diseases, machine learning, deep learning, digital epidemiology
              - generic [ref=f7e108]:
                - heading "Introduction" [level=2] [ref=f7e109]
                - paragraph [ref=f7e110]:
                  - text: Modern technologies have given human society the ability to produce enough food to meet the demand of more than 7 billion people. However, food security remains threatened by a number of factors including climate change (Tai et al.,
                  - link "2014" [ref=f7e111] [cursor=pointer]:
                    - /url: "#B32"
                  - text: ), the decline in pollinators (Report of the Plenary of the Intergovernmental Science-PolicyPlatform on Biodiversity Ecosystem and Services on the work of its fourth session,
                  - link "2016" [ref=f7e112] [cursor=pointer]:
                    - /url: "#B23"
                  - text: ), plant diseases (Strange and Scott,
                  - link "2005" [ref=f7e113] [cursor=pointer]:
                    - /url: "#B30"
                  - text: ), and others. Plant diseases are not only a threat to food security at the global scale, but can also have disastrous consequences for smallholder farmers whose livelihoods depend on healthy crops. In the developing world, more than 80 percent of the agricultural production is generated by smallholder farmers (UNEP,
                  - link "2013" [ref=f7e114] [cursor=pointer]:
                    - /url: "#B33"
                  - text: ), and reports of yield loss of more than 50% due to pests and diseases are common (Harvey et al.,
                  - link "2014" [ref=f7e115] [cursor=pointer]:
                    - /url: "#B9"
                  - text: ). Furthermore, the largest fraction of hungry people (50%) live in smallholder farming households (Sanchez and Swaminathan,
                  - link "2005" [ref=f7e116] [cursor=pointer]:
                    - /url: "#B25"
                  - text: ), making smallholder farmers a group that's particularly vulnerable to pathogen-derived disruptions in food supply.
                - paragraph [ref=f7e117]:
                  - text: Various efforts have been developed to prevent crop loss due to diseases. Historical approaches of widespread application of pesticides have in the past decade increasingly been supplemented by integrated pest management (IPM) approaches (Ehler,
                  - link "2006" [ref=f7e118] [cursor=pointer]:
                    - /url: "#B5"
                  - text: ). Independent of the approach, identifying a disease correctly when it first appears is a crucial step for efficient disease management. Historically, disease identification has been supported by agricultural extension organizations or other institutions, such as local plant clinics. In more recent times, such efforts have additionally been supported by providing information for disease diagnosis online, leveraging the increasing Internet penetration worldwide. Even more recently, tools based on mobile phones have proliferated, taking advantage of the historically unparalleled rapid uptake of mobile phone technology in all parts of the world (ITU,
                  - link "2015" [ref=f7e119] [cursor=pointer]:
                    - /url: "#B14"
                  - text: ).
                - paragraph [ref=f7e120]:
                  - text: Smartphones in particular offer very novel approaches to help identify diseases because of their computing power, high-resolution displays, and extensive built-in sets of accessories, such as advanced HD cameras. It is widely estimated that there will be between 5 and 6 billion smartphones on the globe by 2020. At the end of 2015, already 69% of the world's population had access to mobile broadband coverage, and mobile broadband penetration reached 47% in 2015, a 12-fold increase since 2007 (ITU,
                  - link "2015" [ref=f7e121] [cursor=pointer]:
                    - /url: "#B14"
                  - text: ). The combined factors of widespread smartphone penetration, HD cameras, and high performance processors in mobile devices lead to a situation where disease diagnosis based on automated image recognition, if technically feasible, can be made available at an unprecedented scale. Here, we demonstrate the technical feasibility using a deep learning approach utilizing 54,306 images of 14 crop species with 26 diseases (or healthy) made openly available through the project PlantVillage (Hughes and Salathé,
                  - link "2015" [ref=f7e122] [cursor=pointer]:
                    - /url: "#B13"
                  - text: ). An example of each crop—disease pair can be seen in Figure
                  - link "1" [ref=f7e123] [cursor=pointer]:
                    - /url: "#F1"
                  - text: .
                - figure [ref=f7e124]:
