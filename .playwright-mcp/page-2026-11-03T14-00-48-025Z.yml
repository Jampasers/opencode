                - generic [ref=f7e235]:
                  - heading "Measurement of performance" [level=3] [ref=f7e236]
                  - paragraph [ref=f7e237]:
                    - text: To get a sense of how our approaches will perform on new unseen data, and also to keep a track of if any of our approaches are overfitting, we run all our experiments across a whole range of train-test set splits, namely 80–20 (80% of the whole dataset used for training, and 20% for testing), 60–40 (60% of the whole dataset used for training, and 40% for testing), 50–50 (50% of the whole dataset used for training, and 50% for testing), 40–60 (40% of the whole dataset used for training, and 60% for testing) and finally 20–80 (20% of the whole dataset used for training, and 80% for testing). It must be noted that in many cases, the PlantVillage dataset has multiple images of the same leaf (taken from different orientations), and we have the mappings of such cases for 41,112 images out of the 54,306 images; and during all these test-train splits, we make sure all the images of the same leaf goes either in the training set or the testing set. Further, for every experiment, we compute the mean precision, mean recall, mean F
                    - subscript [ref=f7e238]: "1"
                    - text: score, along with the overall accuracy over the whole period of training at regular intervals (at the end of every epoch). We use the final mean F
                    - subscript [ref=f7e239]: "1"
                    - text: score for the comparison of results across all of the different experimental configurations.
                - generic [ref=f7e240]:
                  - heading "Approach" [level=3] [ref=f7e241]
                  - paragraph [ref=f7e242]:
                    - text: We evaluate the applicability of deep convolutional neural networks for the classification problem described above. We focus on two popular architectures, namely AlexNet (Krizhevsky et al.,
                    - link "2012" [ref=f7e243] [cursor=pointer]:
                      - /url: "#B16"
                    - text: ), and GoogLeNet (Szegedy et al.,
                    - link "2015" [ref=f7e244] [cursor=pointer]:
                      - /url: "#B31"
                    - text: ), which were designed in the context of the “Large Scale Visual Recognition Challenge” (ILSVRC) (Russakovsky et al.,
                    - link "2015" [ref=f7e245] [cursor=pointer]:
                      - /url: "#B24"
                    - text: ) for the ImageNet dataset (Deng et al.,
                    - link "2009" [ref=f7e246] [cursor=pointer]:
                      - /url: "#B4"
                    - text: ).
                  - paragraph [ref=f7e247]:
                    - text: The AlexNet architecture (see Figure
                    - link "S2" [ref=f7e248] [cursor=pointer]:
                      - /url: "#SM1"
                    - text: ) follows the same design pattern as the LeNet-5 (LeCun et al.,
                    - link "1989" [ref=f7e249] [cursor=pointer]:
                      - /url: "#B17"
                    - text: ") architecture from the 1990s. The LeNet-5 architecture variants are usually a set of stacked convolution layers followed by one or more fully connected layers. The convolution layers optionally may have a normalization layer and a pooling layer right after them, and all the layers in the network usually have ReLu non-linear activation units associated with them. AlexNet consists of 5 convolution layers, followed by 3 fully connected layers, and finally ending with a softMax layer. The first two convolution layers (conv{1, 2}) are each followed by a normalization and a pooling layer, and the last convolution layer (conv5) is followed by a single pooling layer. The final fully connected layer (fc8) has 38 outputs in our adapted version of AlexNet (equaling the total number of classes in our dataset), which feeds the softMax layer. The softMax layer finally exponentially normalizes the input that it gets from (fc8), thereby producing a distribution of values across the 38 classes that add up to 1. These values can be interpreted as the confidences of the network that a given input image is represented by the corresponding classes. All of the first 7 layers of AlexNet have a ReLu non-linearity activation unit associated with them, and the first two fully connected layers (fc{6, 7}) have a dropout layer associated with them, with a dropout ratio of 0.5."
                  - paragraph [ref=f7e250]:
                    - text: The GoogleNet architecture on the other hand is a much deeper and wider architecture with 22 layers, while still having considerably lower number of parameters (5 million parameters) in the network than AlexNet (60 million parameters). An application of the “network in network” architecture (Lin et al.,
                    - link "2013" [ref=f7e251] [cursor=pointer]:
                      - /url: "#B19"
                    - text: ) in the form of the inception modules is a key feature of the GoogleNet architecture. The inception module uses parallel 1 × 1, 3 × 3, and 5 × 5 convolutions along with a max-pooling layer in parallel, hence enabling it to capture a variety of features in parallel. In terms of practicality of the implementation, the amount of associated computation needs to be kept in check, which is why 1 × 1 convolutions before the above mentioned 3 × 3, 5 × 5 convolutions (and also after the max-pooling layer) are added for dimensionality reduction. Finally, a filter concatenation layer simply concatenates the outputs of all these parallel layers. While this forms a single inception module, a total of 9 inception modules is used in the version of the GoogLeNet architecture that we use in our experiments. A more detailed overview of this architecture can be found for reference in (Szegedy et al.,
                    - link "2015" [ref=f7e252] [cursor=pointer]:
                      - /url: "#B31"
                    - text: ).
                  - paragraph [ref=f7e253]:
                    - text: "We analyze the performance of both these architectures on the PlantVillage dataset by training the model from scratch in one case, and then by adapting already trained models (trained on the ImageNet dataset) using transfer learning. In case of transfer learning, we re-initialize the weights of layer fc8 in case of AlexNet, and of the loss {1,2,3}/classifier layers in case of GoogLeNet. Then, when training the model, we do not limit the learning of any of the layers, as is sometimes done for transfer learning. In other words, the key difference between these two learning approaches (transfer vs. training from scratch) is in the initial state of weights of a few layers, which lets the transfer learning approach exploit the large amount of visual knowledge already learned by the pre-trained AlexNet and GoogleNet models extracted from ImageNet (Russakovsky et al.,"
                    - link "2015" [ref=f7e254] [cursor=pointer]:
                      - /url: "#B24"
                    - text: ).
                  - paragraph [ref=f7e255]: "To summarize, we have a total of 60 experimental configurations, which vary on the following parameters:"
                  - list [ref=f7e256]:
                    - listitem [ref=f7e257]:
                      - paragraph [ref=f7e258]:
                        - strong [ref=f7e259]: "Choice of deep learning architecture:"
                      - list [ref=f7e260]:
                        - listitem [ref=f7e261]:
                          - paragraph [ref=f7e262]: AlexNet,
                        - listitem [ref=f7e263]:
                          - paragraph [ref=f7e264]: GoogLeNet.
                    - listitem [ref=f7e265]:
                      - paragraph [ref=f7e266]:
                        - strong [ref=f7e267]: "Choice of training mechanism:"
                      - list [ref=f7e268]:
                        - listitem [ref=f7e269]:
                          - paragraph [ref=f7e270]: Transfer Learning,
                        - listitem [ref=f7e271]:
                          - paragraph [ref=f7e272]: Training from Scratch.
                    - listitem [ref=f7e273]:
                      - paragraph [ref=f7e274]:
                        - strong [ref=f7e275]: "Choice of dataset type:"
                      - list [ref=f7e276]:
                        - listitem [ref=f7e277]:
                          - paragraph [ref=f7e278]: Color,
                        - listitem [ref=f7e279]:
                          - paragraph [ref=f7e280]: Gray scale,
                        - listitem [ref=f7e281]:
                          - paragraph [ref=f7e282]: Leaf Segmented.
                    - listitem [ref=f7e283]:
                      - paragraph [ref=f7e284]:
                        - strong [ref=f7e285]: "Choice of training-testing set distribution:"
                      - list [ref=f7e286]:
                        - listitem [ref=f7e287]:
                          - paragraph [ref=f7e288]: "Train: 80%, Test: 20%,"
                        - listitem [ref=f7e289]:
                          - paragraph [ref=f7e290]: "Train: 60%, Test: 40%,"
                        - listitem [ref=f7e291]:
                          - paragraph [ref=f7e292]: "Train: 50%, Test: 50%,"
                        - listitem [ref=f7e293]:
                          - paragraph [ref=f7e294]: "Train: 40%, Test: 60%,"
                        - listitem [ref=f7e295]:
                          - paragraph [ref=f7e296]: "Train: 20%, Test: 80%."
                  - paragraph [ref=f7e297]:
                    - text: Throughout this paper, we have used the notation of
                    - emphasis [ref=f7e298]: Architecture:TrainingMechanism:DatasetType:Train-Test-Set-Distribution
                    - text: to refer to particular experiments. For instance, to refer to the experiment using the GoogLeNet architecture, which was trained using transfer learning on the gray-scaled PlantVillage dataset on a train—test set distribution of 60–40, we will use the notation
                    - emphasis [ref=f7e299]: GoogLeNet:TransferLearning:GrayScale:60–40
                    - text: .
                  - paragraph [ref=f7e300]:
                    - text: Each of these 60 experiments runs for a total of 30 epochs, where one epoch is defined as the number of training iterations in which the particular neural network has completed a full pass of the whole training set. The choice of 30 epochs was made based on the empirical observation that in all of these experiments, the learning always converged well within 30 epochs (as is evident from the aggregated plots (Figure
                    - link "3" [ref=f7e301] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ) across all the experiments).
                  - figure [ref=f7e302]:
                    - heading "Figure 3." [level=4] [ref=f7e303]
                    - paragraph [ref=f7e304]:
                      - link [ref=f7e305] [cursor=pointer]:
                        - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=5032846_fpls-07-01419-g0003.jpg
                        - img "Figure 3" [ref=f7e306]
                        - text: 🔍
                    - link "Open in a new tab" [ref=f7e308] [cursor=pointer]:
                      - /url: figure/F3/
                    - paragraph [ref=f7e310]:
                      - strong [ref=f7e311]:
                        - text: Progression of mean F
                        - subscript [ref=f7e312]: "1"
                        - text: score and loss through the training period of 30 epochs across all experiments, grouped by experimental configuration parameters
                      - text: . The intensity of a particular class at any point is proportional to the corresponding uncertainty across all experiments with the particular configurations.
                      - strong [ref=f7e313]: (A)
                      - text: Comparison of progression of mean F
                      - subscript [ref=f7e314]: "1"
                      - text: score across all experiments, grouped by deep learning architecture,
                      - strong [ref=f7e315]: (B)
                      - text: Comparison of progression of mean F
                      - subscript [ref=f7e316]: "1"
                      - text: score across all experiments, grouped by training mechanism,
                      - strong [ref=f7e317]: (C)
                      - text: Comparison of progression of train-loss and test-loss across all experiments,
                      - strong [ref=f7e318]: (D)
                      - text: Comparison of progression of mean F
                      - subscript [ref=f7e319]: "1"
                      - text: score across all experiments, grouped by train-test set splits,
                      - strong [ref=f7e320]: (E)
                      - text: Comparison of progression of mean F
                      - subscript [ref=f7e321]: "1"
                      - text: score across all experiments, grouped by dataset type. A similar plot of all the observations, as it is, across all the experimental configurations can be found in the Supplementary Material.
                  - paragraph [ref=f7e322]: "To enable a fair comparison between the results of all the experimental configurations, we also tried to standardize the hyper-parameters across all the experiments, and we used the following hyper-parameters in all of the experiments:"
                  - list [ref=f7e323]:
                    - listitem [ref=f7e324]:
                      - paragraph [ref=f7e325]: "Solver type: Stochastic Gradient Descent,"
                    - listitem [ref=f7e326]:
                      - paragraph [ref=f7e327]: "Base learning rate: 0.005,"
                    - listitem [ref=f7e328]:
                      - paragraph [ref=f7e329]: "Learning rate policy: Step (decreases by a factor of 10 every 30/3 epochs),"
                    - listitem [ref=f7e330]:
                      - paragraph [ref=f7e331]: "Momentum: 0.9,"
                    - listitem [ref=f7e332]:
                      - paragraph [ref=f7e333]: "Weight decay: 0.0005,"
                    - listitem [ref=f7e334]:
                      - paragraph [ref=f7e335]: "Gamma: 0.1,"
                    - listitem [ref=f7e336]:
                      - paragraph [ref=f7e337]: "Batch size: 24 (in case of GoogLeNet), 100 (in case of AlexNet)."
                  - paragraph [ref=f7e338]:
                    - text: All the above experiments were conducted using our own fork of Caffe (Jia et al.,
                    - link "2014" [ref=f7e339] [cursor=pointer]:
                      - /url: "#B15"
                    - text: ), which is a fast, open source framework for deep learning. The basic results, such as the overall accuracy can also be replicated using a standard instance of caffe.
              - generic [ref=f7e340]:
                - heading "Results" [level=2] [ref=f7e341]
                - paragraph [ref=f7e342]:
                  - text: At the outset, we note that on a dataset with 38 class labels, random guessing will only achieve an overall accuracy of 2.63% on average. Across all our experimental configurations, which include three visual representations of the image data (see Figure
                  - link "2" [ref=f7e343] [cursor=pointer]:
                    - /url: "#F2"
                  - text: ), the overall accuracy we obtained on the PlantVillage dataset varied from 85.53% (in case of
                  - emphasis [ref=f7e344]: AlexNet::TrainingFromScratch::GrayScale::80–20
                  - text: ) to 99.34% (in case of
                  - emphasis [ref=f7e345]: GoogLeNet::TransferLearning::Color::80–20
                  - text: ), hence showing strong promise of the deep learning approach for similar prediction problems. Table
                  - link "1" [ref=f7e346] [cursor=pointer]:
                    - /url: "#T1"
                  - text: shows the mean F
                  - subscript [ref=f7e347]: "1"
                  - text: score, mean precision, mean recall, and overall accuracy across all our experimental configurations. All the experimental configurations run for a total of 30 epochs each, and they almost consistently converge after the first step down in the learning rate.
