          - region "Article content" [ref=f3e102]:
            - generic [ref=f3e103]:
              - generic [ref=f3e104]:
                - heading "Abstract" [level=2] [ref=f3e105]
                - paragraph [ref=f3e106]: The digital transformation of agriculture has evolved various aspects of management into artificial intelligent systems for the sake of making value from the ever-increasing data originated from numerous sources. A subset of artificial intelligence, namely machine learning, has a considerable potential to handle numerous challenges in the establishment of knowledge-based farming systems. The present study aims at shedding light on machine learning in agriculture by thoroughly reviewing the recent scholarly literature based on keywords’ combinations of “machine learning” along with “crop management”, “water management”, “soil management”, and “livestock management”, and in accordance with PRISMA guidelines. Only journal papers were considered eligible that were published within 2018–2020. The results indicated that this topic pertains to different disciplines that favour convergence research at the international level. Furthermore, crop management was observed to be at the centre of attention. A plethora of machine learning algorithms were used, with those belonging to Artificial Neural Networks being more efficient. In addition, maize and wheat as well as cattle and sheep were the most investigated crops and animals, respectively. Finally, a variety of sensors, attached on satellites and unmanned ground and aerial vehicles, have been utilized as a means of getting reliable input data for the data analyses. It is anticipated that this study will constitute a beneficial guide to all stakeholders towards enhancing awareness of the potential advantages of using machine learning in agriculture and contributing to a more systematic research on this topic.
                - paragraph [ref=f3e108]:
                  - strong [ref=f3e109]: "Keywords:"
                  - text: machine learning, crop management, water management, soil management, livestock management, artificial intelligence, precision agriculture, precision livestock farming
              - generic [ref=f3e110]:
                - heading "1. Introduction" [level=2] [ref=f3e111]
                - generic [ref=f3e112]:
                  - heading "1.1. General Context of Machine Learning in Agriculture" [level=3] [ref=f3e113]
                  - paragraph [ref=f3e114]:
                    - text: Modern agriculture has to cope with several challenges, including the increasing call for food, as a consequence of the global explosion of earth’s population, climate changes [
                    - link "1" [ref=f3e115] [cursor=pointer]:
                      - /url: "#B1-sensors-21-03758"
                    - text: "], natural resources depletion ["
                    - link "2" [ref=f3e116] [cursor=pointer]:
                      - /url: "#B2-sensors-21-03758"
                    - text: "], alteration of dietary choices ["
                    - link "3" [ref=f3e117] [cursor=pointer]:
                      - /url: "#B3-sensors-21-03758"
                    - text: "], as well as safety and health concerns ["
                    - link "4" [ref=f3e118] [cursor=pointer]:
                      - /url: "#B4-sensors-21-03758"
                    - text: "]. As a means of addressing the above issues, placing pressure on the agricultural sector, there exists an urgent necessity for optimizing the effectiveness of agricultural practices by, simultaneously, lessening the environmental burden. In particular, these two essentials have driven the transformation of agriculture into precision agriculture. This modernization of farming has a great potential to assure sustainability, maximal productivity, and a safe environment ["
                    - link "5" [ref=f3e119] [cursor=pointer]:
                      - /url: "#B5-sensors-21-03758"
                    - text: "]. In general, smart farming is based on four key pillars in order to deal with the increasing needs; (a) optimal natural resources’ management, (b) conservation of the ecosystem, (c) development of adequate services, and (d) utilization of modern technologies ["
                    - link "6" [ref=f3e120] [cursor=pointer]:
                      - /url: "#B6-sensors-21-03758"
                    - text: "]. An essential prerequisite of modern agriculture is, definitely, the adoption of Information and Communication Technology (ICT), which is promoted by policy-makers around the world. ICT can indicatively include farm management information systems, humidity and soil sensors, accelerometers, wireless sensor networks, cameras, drones, low-cost satellites, online services, and automated guided vehicles ["
                    - link "7" [ref=f3e121] [cursor=pointer]:
                      - /url: "#B7-sensors-21-03758"
                    - text: "]."
                  - paragraph [ref=f3e122]:
                    - text: The large volume of data, which is produced by digital technologies and usually referred to as “big data”, needs large storage capabilities in addition to editing, analyzing, and interpreting. The latter has a considerable potential to add value for society, environment, and decision-makers [
                    - link "8" [ref=f3e123] [cursor=pointer]:
                      - /url: "#B8-sensors-21-03758"
                    - text: "]. Nevertheless, big data encompass challenges on account of their so-called “5-V” requirements; (a) Volume, (b) Variety, (c) Velocity, (d) Veracity, and (e) Value ["
                    - link "9" [ref=f3e124] [cursor=pointer]:
                      - /url: "#B9-sensors-21-03758"
                    - text: "]. The conventional data processing techniques are incapable of meeting the constantly growing demands in the new era of smart farming, which is an important obstacle for extracting valuable information from field data ["
                    - link "10" [ref=f3e125] [cursor=pointer]:
                      - /url: "#B10-sensors-21-03758"
                    - text: "]. To that end, Machine Learning (ML) has emerged, which is a subset of artificial intelligence ["
                    - link "11" [ref=f3e126] [cursor=pointer]:
                      - /url: "#B11-sensors-21-03758"
                    - text: "], by taking advantage of the exponential computational power capacity growth."
                  - paragraph [ref=f3e127]:
                    - text: There is a plethora of applications of ML in agriculture. According to the recent literature survey by Liakos et al. [
                    - link "12" [ref=f3e128] [cursor=pointer]:
                      - /url: "#B12-sensors-21-03758"
                    - text: "], regarding the time period of 2004 to 2018, four generic categories were identified ("
                    - link "Figure 1" [ref=f3e129] [cursor=pointer]:
                      - /url: "#sensors-21-03758-f001"
                    - text: "). These categories refer to crop, water, soil, and livestock management. In particular, as far as crop management is concerned, it represented the majority of the articles amongst all categories (61% of the total articles) and was further sub-divided into:"
                  - list [ref=f3e130]:
                    - listitem [ref=f3e131]:
                      - paragraph [ref=f3e132]: Yield prediction;
                    - listitem [ref=f3e133]:
                      - paragraph [ref=f3e134]: Disease detection;
                    - listitem [ref=f3e135]:
                      - paragraph [ref=f3e136]: Weed detection;
                    - listitem [ref=f3e137]:
                      - paragraph [ref=f3e138]: Crop recognition;
                    - listitem [ref=f3e139]:
                      - paragraph [ref=f3e140]: Crop quality.
                  - figure [ref=f3e141]:
                    - heading "Figure 1." [level=4] [ref=f3e142]
                    - paragraph [ref=f3e143]:
                      - link [ref=f3e144] [cursor=pointer]:
                        - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=8198852_sensors-21-03758-g001.jpg
                        - img "Figure 1" [ref=f3e145]
                        - text: 🔍
                    - link "Open in a new tab" [ref=f3e147] [cursor=pointer]:
                      - /url: figure/sensors-21-03758-f001/
                    - paragraph [ref=f3e149]:
                      - text: The four generic categories in agriculture exploiting machine learning techniques, as presented in [
                      - link "12" [ref=f3e150] [cursor=pointer]:
                        - /url: "#B12-sensors-21-03758"
                      - text: "]."
                  - paragraph [ref=f3e151]: The generic categories dealing with the management of water and soil were found to be less investigated, corresponding cumulatively to 20% of the total number of papers (10% for each category).
                  - paragraph [ref=f3e152]: "Finally, two main sub-categories were identified for the livestock-related applications corresponding to a total 19% of journal papers:"
                  - list [ref=f3e153]:
                    - listitem [ref=f3e154]:
                      - paragraph [ref=f3e155]: Livestock production;
                    - listitem [ref=f3e156]:
                      - paragraph [ref=f3e157]: Animal welfare.
                - generic [ref=f3e158]:
                  - heading "1.2. Open Problems Associated with Machine Learning in Agriculture" [level=3] [ref=f3e159]
                  - paragraph [ref=f3e160]:
                    - text: Due to the broad range of applications of ML in agriculture, several reviews have been published in this research field. The majority of these review studies have been dedicated to crop disease detection [
                    - link "13" [ref=f3e161] [cursor=pointer]:
                      - /url: "#B13-sensors-21-03758"
                    - text: ","
                    - link "14" [ref=f3e162] [cursor=pointer]:
                      - /url: "#B14-sensors-21-03758"
                    - text: ","
                    - link "15" [ref=f3e163] [cursor=pointer]:
                      - /url: "#B15-sensors-21-03758"
                    - text: ","
                    - link "16" [ref=f3e164] [cursor=pointer]:
                      - /url: "#B16-sensors-21-03758"
                    - text: "], weed detection ["
                    - link "17" [ref=f3e165] [cursor=pointer]:
                      - /url: "#B17-sensors-21-03758"
                    - text: ","
                    - link "18" [ref=f3e166] [cursor=pointer]:
                      - /url: "#B18-sensors-21-03758"
                    - text: "], yield prediction ["
                    - link "19" [ref=f3e167] [cursor=pointer]:
                      - /url: "#B19-sensors-21-03758"
                    - text: ","
                    - link "20" [ref=f3e168] [cursor=pointer]:
                      - /url: "#B20-sensors-21-03758"
                    - text: "], crop recognition ["
                    - link "21" [ref=f3e169] [cursor=pointer]:
                      - /url: "#B21-sensors-21-03758"
                    - text: ","
                    - link "22" [ref=f3e170] [cursor=pointer]:
                      - /url: "#B22-sensors-21-03758"
                    - text: "], water management ["
                    - link "23" [ref=f3e171] [cursor=pointer]:
                      - /url: "#B23-sensors-21-03758"
                    - text: ","
                    - link "24" [ref=f3e172] [cursor=pointer]:
                      - /url: "#B24-sensors-21-03758"
                    - text: "], animal welfare ["
                    - link "25" [ref=f3e173] [cursor=pointer]:
                      - /url: "#B25-sensors-21-03758"
                    - text: ","
                    - link "26" [ref=f3e174] [cursor=pointer]:
                      - /url: "#B26-sensors-21-03758"
                    - text: "], and livestock production ["
                    - link "27" [ref=f3e175] [cursor=pointer]:
                      - /url: "#B27-sensors-21-03758"
                    - text: ","
                    - link "28" [ref=f3e176] [cursor=pointer]:
                      - /url: "#B28-sensors-21-03758"
                    - text: "]. Furthermore, other studies were concerned with the implementation of ML methods regarding the main grain crops by investigating different aspects including quality and disease detection ["
                    - link "29" [ref=f3e177] [cursor=pointer]:
                      - /url: "#B29-sensors-21-03758"
                    - text: "]. Finally, focus has been paid on big data analysis using ML, aiming at finding out real-life problems that originated from smart farming ["
                    - link "30" [ref=f3e178] [cursor=pointer]:
                      - /url: "#B30-sensors-21-03758"
                    - text: "], or dealing with methods to analyze hyperspectral and multispectral data ["
                    - link "31" [ref=f3e179] [cursor=pointer]:
                      - /url: "#B31-sensors-21-03758"
                    - text: "]."
                  - paragraph [ref=f3e180]:
                    - text: Although ML in agriculture has made considerable progress, several open problems remain, which have some common points of reference, despite the fact that the topic covers a variety of sub-fields. According to [
                    - link "23" [ref=f3e181] [cursor=pointer]:
                      - /url: "#B23-sensors-21-03758"
                    - text: ","
                    - link "24" [ref=f3e182] [cursor=pointer]:
                      - /url: "#B24-sensors-21-03758"
                    - text: ","
                    - link "28" [ref=f3e183] [cursor=pointer]:
                      - /url: "#B28-sensors-21-03758"
                    - text: ","
                    - link "32" [ref=f3e184] [cursor=pointer]:
                      - /url: "#B32-sensors-21-03758"
                    - text: "], the main problems are associated with the implementation of sensors on farms for numerous reasons, including high costs of ICT, traditional practices, and lack of information. In addition, the majority of the available datasets do not reflect realistic cases, since they are normally generated by a few people getting images or specimens in a short time period and from a limited area ["
                    - link "15" [ref=f3e185] [cursor=pointer]:
                      - /url: "#B15-sensors-21-03758"
                    - text: ","
                    - link "21" [ref=f3e186] [cursor=pointer]:
                      - /url: "#B21-sensors-21-03758"
                    - text: ","
                    - link "22" [ref=f3e187] [cursor=pointer]:
                      - /url: "#B22-sensors-21-03758"
                    - text: ","
                    - link "23" [ref=f3e188] [cursor=pointer]:
                      - /url: "#B23-sensors-21-03758"
                    - text: "]. Consequently, more practical datasets coming from fields are required ["
                    - link "18" [ref=f3e189] [cursor=pointer]:
                      - /url: "#B18-sensors-21-03758"
                    - text: ","
                    - link "20" [ref=f3e190] [cursor=pointer]:
                      - /url: "#B20-sensors-21-03758"
                    - text: "]. Moreover, the need for more efficient ML algorithms and scalable computational architectures has been pointed out, which can lead to rapid information processing ["
                    - link "18" [ref=f3e191] [cursor=pointer]:
                      - /url: "#B18-sensors-21-03758"
                    - text: ","
                    - link "22" [ref=f3e192] [cursor=pointer]:
                      - /url: "#B22-sensors-21-03758"
                    - text: ","
                    - link "23" [ref=f3e193] [cursor=pointer]:
                      - /url: "#B23-sensors-21-03758"
                    - text: ","
                    - link "31" [ref=f3e194] [cursor=pointer]:
                      - /url: "#B31-sensors-21-03758"
                    - text: "]. The challenging background, when it comes to obtaining images, video, or audio recordings, has also been mentioned owing to changes in lighting ["
                    - link "16" [ref=f3e195] [cursor=pointer]:
                      - /url: "#B16-sensors-21-03758"
                    - text: ","
                    - link "29" [ref=f3e196] [cursor=pointer]:
                      - /url: "#B29-sensors-21-03758"
                    - text: "], blind spots of cameras, environmental noise, and simultaneous vocalizations ["
                    - link "25" [ref=f3e197] [cursor=pointer]:
                      - /url: "#B25-sensors-21-03758"
                    - text: "]. Another important open problem is that the vast majority of farmers are non-experts in ML and, thus, they cannot fully comprehend the underlying patterns obtained by ML algorithms. For this reason, more user-friendly systems should be developed. In particular, simple systems, being easy to understand and operate, would be valuable, as for example a visualization tool with a user-friendly interface for the correct presentation and manipulation of data ["
                    - link "25" [ref=f3e198] [cursor=pointer]:
                      - /url: "#B25-sensors-21-03758"
                    - text: ","
                    - link "30" [ref=f3e199] [cursor=pointer]:
                      - /url: "#B30-sensors-21-03758"
                    - text: ","
                    - link "31" [ref=f3e200] [cursor=pointer]:
                      - /url: "#B31-sensors-21-03758"
                    - text: "]. Taking into account that farmers are getting more and more familiar with smartphones, specific smartphone applications have been proposed as a possible solution to address the above challenge ["
                    - link "15" [ref=f3e201] [cursor=pointer]:
                      - /url: "#B15-sensors-21-03758"
                    - text: ","
                    - link "16" [ref=f3e202] [cursor=pointer]:
                      - /url: "#B16-sensors-21-03758"
                    - text: ","
                    - link "21" [ref=f3e203] [cursor=pointer]:
                      - /url: "#B21-sensors-21-03758"
                    - text: "]. Last but not least, the development of efficient ML techniques by incorporating expert knowledge from different stakeholders should be fostered, particularly regarding computing science, agriculture, and the private sector, as a means of designing realistic solutions ["
                    - link "19" [ref=f3e204] [cursor=pointer]:
                      - /url: "#B19-sensors-21-03758"
                    - text: ","
                    - link "22" [ref=f3e205] [cursor=pointer]:
                      - /url: "#B22-sensors-21-03758"
                    - text: ","
                    - link "24" [ref=f3e206] [cursor=pointer]:
                      - /url: "#B24-sensors-21-03758"
                    - text: ","
                    - link "33" [ref=f3e207] [cursor=pointer]:
                      - /url: "#B33-sensors-21-03758"
                    - text: "]. As stated in ["
                    - link "12" [ref=f3e208] [cursor=pointer]:
                      - /url: "#B12-sensors-21-03758"
                    - text: "], currently, all of the efforts pertain to individual solutions, which are not always connected with the process of decision-making, as seen for example in other domains."
                - generic [ref=f3e209]:
                  - heading "1.3. Aim of the Present Study" [level=3] [ref=f3e210]
                  - paragraph [ref=f3e211]:
                    - text: As pointed out above, because of the multiple applications of ML in agriculture, several review studies have been published recently. However, these studies usually concentrate purely on one sub-field of agricultural production. Motivated by the current tremendous progress in ML, the increasing interest worldwide, and its impact in various do-mains of agriculture, a systematic bibliographic survey is presented on the range of the categories proposed in [
                    - link "12" [ref=f3e212] [cursor=pointer]:
                      - /url: "#B12-sensors-21-03758"
                    - text: "], which were summarized in"
                    - link "Figure 1" [ref=f3e213] [cursor=pointer]:
                      - /url: "#sensors-21-03758-f001"
                    - text: . In particular, we focus on reviewing the relevant literature of the last three years (2018–2020) for the intention of providing an updated view of ML applications in agricultural systems. In fact, this work is an updated continuation of the work presented at [
                    - link "12" [ref=f3e214] [cursor=pointer]:
                      - /url: "#B12-sensors-21-03758"
                    - text: "]; following, consequently, exactly the same framework and inclusion criteria. As a consequence, the scholarly literature was screened in order to cover a broad spectrum of important features for capturing the current progress and trends, including the identification of: (a) the research areas which are interested mostly in ML in agriculture along with the geographical distribution of the contributing organizations, (b) the most efficient ML models, (c) the most investigated crops and animals, and (d) the most implemented features and technologies."
                  - paragraph [ref=f3e215]:
                    - text: As will be discussed next, overall, a 745% increase in the number of journal papers took place in the last three years as compared to [
                    - link "12" [ref=f3e216] [cursor=pointer]:
                      - /url: "#B12-sensors-21-03758"
                    - text: "], thus justifying the need for a new updated review on the specific topic. Moreover, crop management remained as the most investigated topic, with a number of ML algorithms having been exploited as a means of tackling the heterogeneous data that originated from agricultural fields. As compared to ["
                    - link "12" [ref=f3e217] [cursor=pointer]:
                      - /url: "#B12-sensors-21-03758"
                    - text: "], more crop and animal species have been investigated by using an extensive range of input parameters coming mainly from remote sensing, such as satellites and drones. In addition, people from different research fields have dealt with ML in agriculture, hence, contributing to the remarkable advancement in this field."
                - generic [ref=f3e218]:
                  - heading "1.4. Outline of the Paper" [level=3] [ref=f3e219]
                  - paragraph [ref=f3e220]:
                    - text: The remainder of this paper is structured as follows. The second section briefly describes the fundamentals of ML along with the subject of the four generic categories for the sake of better comprehension of the scope of the present study. The implemented methodology, along with the inclusive criteria and the search engines, is analyzed in the third section. The main performance metrics, which were used in the selected articles, are also presented in this section. The main results are shown in the fourth section in the form of bar and pie charts, while in the fifth section, the main conclusions are drawn by also discussing the results from a broader perspective. Finally, all the selected journal papers are summarized in
                    - link "Table A1" [ref=f3e221] [cursor=pointer]:
                      - /url: "#sensors-21-03758-t0A1"
                    - text: ","
                    - link "Table A2" [ref=f3e222] [cursor=pointer]:
                      - /url: "#sensors-21-03758-t0A2"
                    - text: ","
                    - link "Table A3" [ref=f3e223] [cursor=pointer]:
