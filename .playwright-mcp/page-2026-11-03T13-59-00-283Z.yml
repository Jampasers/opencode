                    - paragraph [ref=f3e365]:
                      - text: The flowchart of the methodology of the present systematic review along with the flow of information regarding the exclusive criteria, based on PRISMA guidelines [
                      - link "75" [ref=f3e366] [cursor=pointer]:
                        - /url: "#B75-sensors-21-03758"
                      - text: "]."
                - generic [ref=f3e367]:
                  - heading "3.2. Definition of the Performance Metrics Commonly Used in the Reviewed Studies" [level=3] [ref=f3e368]
                  - paragraph [ref=f3e369]: "In this subsection, the most commonly used performance metrics of the reviewed papers are briefly described. In general, these metrics are utilized in an effort to provide a common measure to evaluate the ML algorithms. The selection of the appropriate metrics is very important, since: (a) how the algorithm’s performance is measured relies on these metrics and (b) the metric itself can influence the way the significance of several characteristics is weighted."
                  - paragraph [ref=f3e370]:
                    - text: "Confusion matrix constitutes one of the most intuitive metrics towards finding the correctness of a model. It is used for classification problems, where the result can be of at least two types of classes. Let us consider a simple example, by giving a label to a target variable: for example, “1” when a plant has been infected with a disease and “0” otherwise. In this simplified case, the confusion matrix ("
                    - link "Figure 4" [ref=f3e371] [cursor=pointer]:
                      - /url: "#sensors-21-03758-f004"
                    - text: ") is a 2 × 2 table having two dimensions, namely “Actual” and “Predicted”, while its dimensions have the outcome of the comparison between the predictions with the actual class label. Concerning the above simplified example, this outcome can acquire the following values:"
                  - list [ref=f3e372]:
                    - listitem [ref=f3e373]:
                      - paragraph [ref=f3e374]: "True Positive (TP): The plant has a disease (1) and the model classifies this case as diseased (1);"
                    - listitem [ref=f3e375]:
                      - paragraph [ref=f3e376]: "True Negative (TN): The plant does not have a disease (0) and the model classifies this case as a healthy plant (0);"
                    - listitem [ref=f3e377]:
                      - paragraph [ref=f3e378]: "False Positive (FP): The plant does not have a disease (0), but the model classifies this case as diseased (1);"
                    - listitem [ref=f3e379]:
                      - paragraph [ref=f3e380]: "False Negative (FN): The plant has a disease (1), but the model classifies this case as a healthy plant (0)."
                  - figure [ref=f3e381]:
                    - heading "Figure 4." [level=4] [ref=f3e382]
                    - paragraph [ref=f3e383]:
                      - link [ref=f3e384] [cursor=pointer]:
                        - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=8198852_sensors-21-03758-g004.jpg
                        - img "Figure 4" [ref=f3e385]
                        - text: 🔍
                    - link "Open in a new tab" [ref=f3e387] [cursor=pointer]:
                      - /url: figure/sensors-21-03758-f004/
                    - paragraph [ref=f3e389]: Representative illustration of a simplified confusion matrix.
                  - paragraph [ref=f3e390]:
                    - text: As can be shown in
                    - link "Table 1" [ref=f3e391] [cursor=pointer]:
                      - /url: "#sensors-21-03758-t001"
                    - text: ", the aforementioned values can be implemented in order to estimate the performance metrics, typically observed in classification problems ["
                    - link "79" [ref=f3e392] [cursor=pointer]:
                      - /url: "#B79-sensors-21-03758"
                    - text: "]."
                  - generic [ref=f3e393]:
                    - heading "Table 1." [level=4] [ref=f3e394]
                    - paragraph [ref=f3e396]: Summary of the most commonly used evaluation metrics of the reviewed studies.
                    - table [ref=f3e398]:
                      - rowgroup [ref=f3e399]:
                        - row [ref=f3e400]:
                          - columnheader "Name" [ref=f3e401]
                          - columnheader "Formula" [ref=f3e402]
                      - rowgroup [ref=f3e403]:
                        - row [ref=f3e404]:
                          - cell "Accuracy" [ref=f3e405]
                          - cell "(TP + TN)/(TP + FP + FN + TN)" [ref=f3e406]
                        - row [ref=f3e407]:
                          - cell "Recall" [ref=f3e408]
                          - cell "TP/(TP + FN)" [ref=f3e409]
                        - row [ref=f3e410]:
                          - cell "Precision" [ref=f3e411]
                          - cell "TP/(TP + FP)" [ref=f3e412]
                        - row [ref=f3e413]:
                          - cell "Specificity" [ref=f3e414]
                          - cell "TN/(TN + FP)" [ref=f3e415]
                        - row [ref=f3e416]:
                          - cell "F1 score" [ref=f3e417]
                          - cell "(2 × Recall × Precision)/(Recall + Precision)" [ref=f3e418]
                    - link "Open in a new tab" [ref=f3e420] [cursor=pointer]:
                      - /url: table/sensors-21-03758-t001/
                  - paragraph [ref=f3e421]:
                    - text: Other common evaluation metrics were the coefficient of correlation (), coefficient of determination (; basically, the square of the correlation coefficient), Mean Absolute Error (MAE), Mean Absolute Percentage Error (MAPE), and Mean Squared Error (MSE), which can be given via the following relationships [
                    - link "80" [ref=f3e422] [cursor=pointer]:
                      - /url: "#B80-sensors-21-03758"
                    - text: ","
                    - link "81" [ref=f3e423] [cursor=pointer]:
                      - /url: "#B81-sensors-21-03758"
                    - text: "]:"
                  - table [ref=f3e424]:
                    - rowgroup [ref=f3e425]:
                      - row [ref=f3e426]:
                        - cell [ref=f3e427]
                        - cell "(1)" [ref=f3e428]
                  - table [ref=f3e429]:
                    - rowgroup [ref=f3e430]:
                      - row [ref=f3e431]:
                        - cell [ref=f3e432]
                        - cell "(2)" [ref=f3e433]
                  - table [ref=f3e434]:
                    - rowgroup [ref=f3e435]:
                      - row [ref=f3e436]:
                        - cell [ref=f3e437]
                        - cell "(3)" [ref=f3e438]
                  - table [ref=f3e439]:
                    - rowgroup [ref=f3e440]:
                      - row [ref=f3e441]:
                        - cell [ref=f3e442]
                        - cell "(4)" [ref=f3e443]
                  - paragraph [ref=f3e444]: where and correspond to the predicted and real value, respectively, stands for the iteration at each point, while for the testing records number. Accordingly, low values of MAE, MAPE, and MSE values denote a small error and, hence, better performance. In contrast, near 1 is desired, which demonstrates better model performance and also that the regression curve efficiently fits the data.
              - generic [ref=f3e445]:
                - heading "4. Results" [level=2] [ref=f3e446]
                - generic [ref=f3e447]:
                  - heading "4.1. Preliminary Data Visualization Analysis" [level=3] [ref=f3e448]
                  - paragraph [ref=f3e449]:
                    - text: "Graphical representation of data related to the reviewed studies, by using maps, bar or pie charts, for example, can provide an efficient approach to demonstrate and interpret the patterns of data. The data visualization analysis, as it usually refers to, can be vital in the context of analyzing large amounts of data and has gained remarkable attention in the past few years, including review studies. Indicatively, significant results can be deduced in an effort to identify: (a) the most contributing authors and organizations, (b) the most contributing international journals (or equivalently which research fields are interested in this topic), and (c) the current trends in this field ["
                    - link "82" [ref=f3e450] [cursor=pointer]:
                      - /url: "#B82-sensors-21-03758"
                    - text: "]."
                  - generic [ref=f3e451]:
                    - heading "4.1.1. Classification of the Studies in Terms of Application Domain" [level=4] [ref=f3e452]
                    - paragraph [ref=f3e453]:
                      - text: As can be seen in the flowchart of the present methodology (
                      - link "Figure 3" [ref=f3e454] [cursor=pointer]:
                        - /url: "#sensors-21-03758-f003"
                      - text: ), the literature survey on ML in agriculture resulted in 338 journal papers. Subsequently, these studies were classified into the four generic categories as well as into their sub-categories, as already mentioned above.
                      - link "Figure 5" [ref=f3e455] [cursor=pointer]:
                        - /url: "#sensors-21-03758-f005"
                      - text: "depicts the aforementioned papers’ distribution. In particular, the majority of the studies were intended for crop management (68%), while soil management (10%), water management (10%), and livestock management (12% in total; animal welfare: 7% and livestock production: 5%) had almost equal contribution in the present bibliographic survey. Focusing on crop management, the most contributing sub-categories were yield prediction (20%) and disease detection (19%). The former research field arises as a consequence of the increasing interest of farmers in taking decisions based on efficient management that can lead to the desired yield. Disease detection, on the other hand, is also very important, as diseases constitute a primary menace for food security and quality assurance. Equal percentages (13%) were observed for weed detection and crop recognition, both of which are essential in crop management at farm and agricultural policy making level. Finally, examination of crop quality was relatively scarce corresponding to 3% of all studies. This can be attributed to the complexity of monitoring and modeling the quality-related parameters."
