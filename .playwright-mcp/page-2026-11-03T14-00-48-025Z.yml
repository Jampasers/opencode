                    - paragraph [ref=f7e570]:
                      - text: The bold values are the F
                      - subscript [ref=f7e571]: "1"
                      - text: scores of the best performing models in the respective row/column.
                - paragraph [ref=f7e572]:
                  - text: To address the issue of over-fitting, we vary the test set to train set ratio and observe that even in the extreme case of training on only 20% of the data and testing the trained model on the rest 80% of the data, the model achieves an overall accuracy of 98.21% (mean F
                  - subscript [ref=f7e573]: "1"
                  - text: score of 0.9820) in the case of
                  - emphasis [ref=f7e574]: GoogLeNet::TransferLearning::Color::20–80
                  - text: . As expected, the overall performance of both AlexNet and GoogLeNet do degrade if we keep increasing the test set to train set ratio (see Figure
                  - link "3D" [ref=f7e575] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ), but the decrease in performance is not as drastic as we would expect if the model was indeed over-fitting. Figure
                  - link "3C" [ref=f7e576] [cursor=pointer]:
                    - /url: "#F3"
                  - text: also shows that there is no divergence between the validation loss and the training loss, confirming that over-fitting is not a contributor to the results we obtain across all our experiments.
                - paragraph [ref=f7e577]:
                  - text: Among the AlexNet and GoogLeNet architectures, GoogLeNet consistently performs better than AlexNet (Figure
                  - link "3A" [ref=f7e578] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ), and based on the method of training, transfer learning always yields better results (Figure
                  - link "3B" [ref=f7e579] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ), both of which were expected.
                - paragraph [ref=f7e580]:
                  - text: The three versions of the dataset (color, gray-scale, and segmented) show a characteristic variation in performance across all the experiments when we keep the rest of the experimental configuration constant. The models perform the best in case of the colored version of the dataset. When designing the experiments, we were concerned that the neural networks might only learn to pick up the inherent biases associated with the lighting conditions, the method and apparatus of collection of the data. We therefore experimented with the gray-scaled version of the same dataset to test the model's adaptability in the absence of color information, and its ability to learn higher level structural patterns typical to particular crops and diseases. As expected, the performance did decrease when compared to the experiments on the colored version of the dataset, but even in the case of the worst performance, the observed mean F
                  - subscript [ref=f7e581]: "1"
                  - text: score was 0.8524 (overall accuracy of 85.53%). The segmented versions of the whole dataset was also prepared to investigate the role of the background of the images in overall performance, and as shown in Figure
                  - link "3E" [ref=f7e582] [cursor=pointer]:
                    - /url: "#F3"
                  - text: ", the performance of the model using segmented images is consistently better than that of the model using gray-scaled images, but slightly lower than that of the model using the colored version of the images."
                - paragraph [ref=f7e583]:
                  - text: While these approaches yield excellent results on the PlantVillage dataset which was collected in a controlled environment, we also assessed the model's performance on images sampled from trusted online sources, such as academic agriculture extension services. Such images are not available in large numbers, and using a combination of automated download from Bing Image Search and IPM Images with a visual verification step, we obtained two small, verified datasets of 121 (dataset 1) and 119 images (dataset 2), respectively (see Supplementary Material for a detailed description of the process). Using the best model on these datasets, we obtained an overall accuracy of 31.40% in dataset 1, and 31.69% in dataset 2, in successfully predicting the correct class label (i.e., crop and disease information) from among 38 possible class labels. We note that a random classifier will obtain an average accuracy of only 2.63%. Across all images, the correct class was in the top-5 predictions in 52.89% of the cases in dataset 1, and in 65.61% of the cases in dataset 2. The best models for the two datasets were
                  - emphasis [ref=f7e584]: GoogLeNet:Segmented:TransferLearning:80–20
                  - text: for dataset 1, and
                  - emphasis [ref=f7e585]: GoogLeNet:Color:TransferLearning:80–20
                  - text: for dataset 2. An example image from theses datasets, along with its visualization of activations in the initial layers of an AlexNet architecture, can be seen in Figure
                  - link "4" [ref=f7e586] [cursor=pointer]:
                    - /url: "#F4"
                  - text: .
                - figure [ref=f7e587]:
                  - heading "Figure 4." [level=3] [ref=f7e588]
                  - paragraph [ref=f7e589]:
                    - link [ref=f7e590] [cursor=pointer]:
                      - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=5032846_fpls-07-01419-g0004.jpg
                      - img "Figure 4" [ref=f7e591]
                      - text: 🔍
                  - link "Open in a new tab" [ref=f7e593] [cursor=pointer]:
                    - /url: figure/F4/
                  - paragraph [ref=f7e595]:
                    - strong [ref=f7e596]: Visualization of activations in the initial layers of an AlexNet architecture demonstrating that the model has learnt to efficiently activate against the diseased spots on the example leaf. (A)
                    - text: "Example image of a leaf suffering from Apple Cedar Rust, selected from the top-20 images returned by Bing Image search for the keywords “Apple Cedar Rust Leaves” on April 4th, 2016. Image Reference: Clemson University - USDA Cooperative Extension Slide Series, Bugwood. org."
                    - strong [ref=f7e597]: (B)
                    - text: Visualization of activations in the first convolution layer(conv1) of an AlexNet architecture trained using
                    - emphasis [ref=f7e598]: AlexNet:Color:TrainFromScratch:80–20
                    - text: when doing a forward pass on the image in shown in panel b.
                - paragraph [ref=f7e599]:
                  - text: So far, all results have been reported under the assumption that the model needs to detect both the crop species and the disease status. We can limit the challenge to a more realistic scenario where the crop species is provided, as it can be expected to be known by those growing the crops. To assess this the performance of the model under this scenario, we limit ourselves to crops where we have at least
                  - emphasis [ref=f7e600]: "n"
                  - text: "> = 2 (to avoid trivial classification) or"
                  - emphasis [ref=f7e601]: "n"
                  - text: "> = 3 classes per crop. In the"
                  - emphasis [ref=f7e602]: "n"
                  - text: "> = 2 case, dataset 1 contains 33 classes distributed among 9 crops. Random guessing in such a dataset would achieve an accuracy of 0.225, while our model has an accuracy of 0.478. In the"
                  - emphasis [ref=f7e603]: "n"
                  - text: "> = 3 case, the dataset contains 25 classes distributed among 5 crops. Random guessing in such a dataset would achieve an accuracy of 0.179, while our model has an accuracy of 0.411."
                - paragraph [ref=f7e604]:
                  - text: Similarly, in the
                  - emphasis [ref=f7e605]: "n"
                  - text: "> = 2 case, dataset 2 contains 13 classes distributed among 4 crops. Random guessing in such a dataset would achieve an accuracy of 0.314, while our model has an accuracy of 0.545. In the"
                  - emphasis [ref=f7e606]: "n"
                  - text: "> = 3 case, the dataset contains 11 classes distributed among 3 crops. Random guessing in such a dataset would achieve an accuracy of 0.288, while our model has an accuracy of 0.485."
              - generic [ref=f7e607]:
                - heading "Discussion" [level=2] [ref=f7e608]
                - paragraph [ref=f7e609]:
                  - text: The performance of convolutional neural networks in object recognition and image classification has made tremendous progress in the past few years. (Krizhevsky et al.,
                  - link "2012" [ref=f7e610] [cursor=pointer]:
                    - /url: "#B16"
                  - text: ; Simonyan and Zisserman,
                  - link "2014" [ref=f7e611] [cursor=pointer]:
                    - /url: "#B28"
                  - text: ; Zeiler and Fergus,
                  - link "2014" [ref=f7e612] [cursor=pointer]:
                    - /url: "#B35"
                  - text: ; He et al.,
                  - link "2015" [ref=f7e613] [cursor=pointer]:
                    - /url: "#B10"
                  - text: ; Szegedy et al.,
                  - link "2015" [ref=f7e614] [cursor=pointer]:
                    - /url: "#B31"
                  - text: ). Previously, the traditional approach for image classification tasks has been based on hand-engineered features, such as SIFT (Lowe,
                  - link "2004" [ref=f7e615] [cursor=pointer]:
                    - /url: "#B20"
                  - text: ), HoG (Dalal and Triggs,
                  - link "2005" [ref=f7e616] [cursor=pointer]:
                    - /url: "#B3"
                  - text: ), SURF (Bay et al.,
                  - link "2008" [ref=f7e617] [cursor=pointer]:
                    - /url: "#B1"
                  - text: ), etc., and then to use some form of learning algorithm in these feature spaces. The performance of these approaches thus depended heavily on the underlying predefined features. Feature engineering itself is a complex and tedious process which needs to be revisited every time the problem at hand or the associated dataset changes considerably. This problem occurs in all traditional attempts to detect plant diseases using computer vision as they lean heavily on hand-engineered features, image enhancement techniques, and a host of other complex and labor-intensive methodologies.
                - paragraph [ref=f7e618]:
                  - text: In addition, traditional approaches to disease classification via machine learning typically focus on a small number of classes usually within a single crop. Examples include a feature extraction and classification pipeline using thermal and stereo images in order to classify tomato powdery mildew against healthy tomato leaves (Raza et al.,
                  - link "2015" [ref=f7e619] [cursor=pointer]:
                    - /url: "#B22"
                  - text: ); the detection of powdery mildew in uncontrolled environments using RGB images (Hernández-Rabadán et al.,
                  - link "2014" [ref=f7e620] [cursor=pointer]:
                    - /url: "#B11"
                  - text: ); the use of RGBD images for detection of apple scab (Chéné et al.,
                  - link "2012" [ref=f7e621] [cursor=pointer]:
                    - /url: "#B2"
                  - text: ) the use of fluorescence imaging spectroscopy for detection of citrus huanglongbing (Wetterich et al.,
                  - link "2012" [ref=f7e622] [cursor=pointer]:
                    - /url: "#B34"
                  - text: ) the detection of citrus huanglongbing using near infrared spectral patterns (Sankaran et al.,
                  - link "2011" [ref=f7e623] [cursor=pointer]:
                    - /url: "#B26"
                  - text: ) and aircraft-based sensors (Garcia-Ruiz et al.,
                  - link "2013" [ref=f7e624] [cursor=pointer]:
                    - /url: "#B7"
                  - text: ) the detection of tomato yellow leaf curl virus by using a set of classic feature extraction steps, followed by classification using a support vector machines pipeline (Mokhtar et al.,
                  - link "2015" [ref=f7e625] [cursor=pointer]:
                    - /url: "#B21"
                  - text: ), and many others. A very recent review on the use of machine learning on plant phenotyping (Singh et al.,
                  - link "2015" [ref=f7e626] [cursor=pointer]:
                    - /url: "#B29"
                  - text: ) extensively discusses the work in this domain. While neural networks have been used before in plant disease identification (Huang,
                  - link "2007" [ref=f7e627] [cursor=pointer]:
                    - /url: "#B12"
                  - text: ) (for the classification and detection of
                  - emphasis [ref=f7e628]: Phalaenopsis
                  - text: seedling disease like bacterial soft rot, bacterial brown spot, and
                  - emphasis [ref=f7e629]: Phytophthora
                  - text: black rot), the approach required representing the images using a carefully selected list of texture features before the neural network could classify them.
                - paragraph [ref=f7e630]:
                  - text: Our approach is based on recent work Krizhevsky et al. (
                  - link "2012" [ref=f7e631] [cursor=pointer]:
                    - /url: "#B16"
                  - text: ) which showed for the first time that end-to-end supervised training using a deep convolutional neural network architecture is a practical possibility even for image classification problems with a very large number of classes, beating the traditional approaches using hand-engineered features by a substantial margin in standard benchmarks. The absence of the labor-intensive phase of feature engineering and the generalizability of the solution makes them a very promising candidate for a practical and scaleable approach for computational inference of plant diseases.
                - paragraph [ref=f7e632]: Using the deep convolutional neural network architecture, we trained a model on images of plant leaves with the goal of classifying both crop species and the presence and identity of disease on images that the model had not seen before. Within the PlantVillage data set of 54,306 images containing 38 classes of 14 crop species and 26 diseases (or absence thereof), this goal has been achieved as demonstrated by the top accuracy of 99.35%. Thus, without any feature engineering, the model correctly classifies crop and disease from 38 possible classes in 993 out of 1000 images. Importantly, while the training of the model takes a lot of time (multiple hours on a high performance GPU cluster computer), the classification itself is very fast (less than a second on a CPU), and can thus easily be implemented on a smartphone. This presents a clear path toward smartphone-assisted crop disease diagnosis on a massive global scale.
                - paragraph [ref=f7e633]: However, there are a number of limitations at the current stage that need to be addressed in future work. First, when tested on a set of images taken under conditions different from the images used for training, the model's accuracy is reduced substantially, to just above 31%. It's important to note that this accuracy is much higher than the one based on random selection of 38 classes (2.6%), but nevertheless, a more diverse set of training data is needed to improve the accuracy. Our current results indicate that more (and more variable) data alone will be sufficient to substantially increase the accuracy, and corresponding data collection efforts are underway.
                - paragraph [ref=f7e634]: The second limitation is that we are currently constrained to the classification of single leaves, facing up, on a homogeneous background. While these are straightforward conditions, a real world application should be able to classify images of a disease as it presents itself directly on the plant. Indeed, many diseases don't present themselves on the upper side of leaves only (or at all), but on many different parts of the plant. Thus, new image collection efforts should try to obtain images from many different perspectives, and ideally from settings that are as realistic as possible.
                - paragraph [ref=f7e635]: At the same time, by using 38 classes that contain both crop species and disease status, we have made the challenge harder than ultimately necessary from a practical perspective, as growers are expected to know which crops they are growing. Given the very high accuracy on the PlantVillage dataset, limiting the classification challenge to the disease status won't have a measurable effect. However, on the real world datasets, we can measure noticeable improvements in accuracy. Overall, the presented approach works reasonably well with many different crop species and diseases, and is expected to improve considerably with more training data.
                - paragraph [ref=f7e636]:
                  - text: Finally, it's worth noting that the approach presented here is not intended to replace existing solutions for disease diagnosis, but rather to supplement them. Laboratory tests are ultimately always more reliable than diagnoses based on visual symptoms alone, and oftentimes early-stage diagnosis via visual inspection alone is challenging. Nevertheless, given the expectation of more than 5 Billion smartphones in the world by 2020—of which almost a Billion in Africa (GSMA Intelligence,
                  - link "2016" [ref=f7e637] [cursor=pointer]:
                    - /url: "#B8"
                  - text: )—we do believe that the approach represents a viable additional method to help prevent yield loss. What's more, in the future, image data from a smartphone may be supplemented with location and time information for additional improvements in accuracy. Last but not least, it would be prudent to keep in mind the stunning pace at which mobile technology has developed in the past few years, and will continue to do so. With ever improving number and quality of sensors on mobiles devices, we consider it likely that highly accurate diagnoses via the smartphone are only a question of time.
