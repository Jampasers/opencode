                  - generic [ref=f3e554]:
                    - heading "4.1.3. Distribution of the Most Contributing Journal Papers" [level=4] [ref=f3e555]
                    - paragraph [ref=f3e556]:
                      - text: For the purpose of identifying the research areas that are mostly interested in ML in agriculture, the most frequently appeared international journal papers are depicted in
                      - link "Figure 7" [ref=f3e557] [cursor=pointer]:
                        - /url: "#sensors-21-03758-f007"
                      - text: . In total, there were 129 relevant journals. However, in this bar chart, only the journals contributing with at least 4 papers are presented for brevity. As a general remark, remote sensing was of particular importance, since reliable data from satellites and UAV, for instance, constitute valuable input data for the ML algorithms. In addition, smart farming, environment, and agricultural sustainability were of central interest. Journals associated with computational techniques were also presented with considerable frequency. A typical example of such type of journals, which was presented in the majority of the studies with a percentage of 19.8%, was “
                      - emphasis [ref=f3e558]: Computers and Electronics in Agriculture
                      - text: ”. This journal aims at providing the advances in relation to the application of computers and electronic systems for solving problems in plant and animal production.
                    - figure [ref=f3e559]:
                      - heading "Figure 7." [level=5] [ref=f3e560]
                      - paragraph [ref=f3e561]:
                        - link [ref=f3e562] [cursor=pointer]:
                          - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=8198852_sensors-21-03758-g007.jpg
                          - img "Figure 7" [ref=f3e563]
                          - text: 🔍
                      - link "Open in a new tab" [ref=f3e565] [cursor=pointer]:
                        - /url: figure/sensors-21-03758-f007/
                      - paragraph [ref=f3e567]: Distribution of the most contributing international journals (published at least four articles) concerning applications of machine learning in agriculture.
                    - paragraph [ref=f3e568]:
                      - text: The “
                      - emphasis [ref=f3e569]: Remote Sensing
                      - text: ” and “
                      - emphasis [ref=f3e570]: Sensors
                      - text: ” journals followed with approximately 11.8% and 6.5% of the total number of publications, respectively. These are cross-sectoral journals that are concentrated on applications of science and sensing technologies in various fields, including agriculture. Other journals, covering this research field, were also “
                      - emphasis [ref=f3e571]: IEEE Access
                      - text: ” and “
                      - emphasis [ref=f3e572]: International Journal of Remote Sensing
                      - text: ” with approximately 2.1% and 1.2% contribution, respectively. Moreover, agriculture-oriented journals were also presented in
                      - link "Figure 7" [ref=f3e573] [cursor=pointer]:
                        - /url: "#sensors-21-03758-f007"
                      - text: ", including “"
                      - emphasis [ref=f3e574]: Precision Agriculture
                      - text: ”, “
                      - emphasis [ref=f3e575]: Frontiers in Plant Science
                      - text: ”, “
                      - emphasis [ref=f3e576]: Agricultural and Forest Meteorology
                      - text: ”, and “
                      - emphasis [ref=f3e577]: Agricultural Water Management
                      - text: ” with 1–3% percentage. These journals deal with several aspects of agriculture ranging from management strategies (so as to incorporate spatial and temporal data as a means of optimizing productivity, resource use efficiency, sustainability and profitability of agricultural production) up to crop molecular genetics and plant pathogens. An interdisciplinary journal concentrating on soil functions and processes also appeared with 2.1%, namely “
                      - emphasis [ref=f3e578]: Geoderma
                      - text: ”, plausibly covering the soil management generic category. Finally, several journals focusing on physics and applied natural sciences, such as “
                      - emphasis [ref=f3e579]: Applied Sciences
                      - text: ” (2.7%), “
                      - emphasis [ref=f3e580]: Scientific Reports
                      - text: ” (1.8%), “
                      - emphasis [ref=f3e581]: Biosystems Engineering
                      - text: ” (1.5%), and “
                      - emphasis [ref=f3e582]: PLOS ONE
                      - text: ” (1.5%), had a notable contribution to ML studies. As a consequence, ML in agriculture concerns several disciplines and constitutes a fundamental area for developing various techniques, which can be beneficial to other fields as well.
