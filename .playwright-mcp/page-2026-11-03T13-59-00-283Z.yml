                  - generic [ref=f3e538]:
                    - heading "4.1.2. Geographical Distribution of the Contributing Organizations" [level=4] [ref=f3e539]
                    - paragraph [ref=f3e540]:
                      - text: The subject of this sub-section is to find out the geographical distribution of all the contributing organizations in ML applications in agriculture. To that end, the author’s affiliation was taken into account. In case a paper included more than one author, which was the most frequent scenario, each country could contribute only once in the final map chart (
                      - link "Figure 6" [ref=f3e541] [cursor=pointer]:
                        - /url: "#sensors-21-03758-f006"
                      - text: ), similarly to [
                      - link "83" [ref=f3e542] [cursor=pointer]:
                        - /url: "#B83-sensors-21-03758"
                      - text: ","
                      - link "84" [ref=f3e543] [cursor=pointer]:
                        - /url: "#B84-sensors-21-03758"
                      - text: "]. As can be gleaned from"
                      - link "Figure 6" [ref=f3e544] [cursor=pointer]:
                        - /url: "#sensors-21-03758-f006"
                      - text: ", investigating ML in agriculture is distributed worldwide, including both developed and developing economies. Remarkably, out of the 55 contributing countries, the least contribution originated from African countries (3%), whereas the major contribution came from Asian countries (55%). The latter result is attributed mainly to the considerable contribution of Chinese (24.9%) as well as Indian organizations (10.1%). USA appeared to be the second most contributing country with 20.7% percentage, while Australia (9.5%), Spain (6.8%), Germany (5.9%), Brazil, UK, and Iran (5.62%) seem to be particularly interested in ML in agriculture. It should be stressed that livestock management, which is a relatively different sub-field comparing to crop, water, and soil management, was primary examined from studies coming from Australia, USA, China, and UK, while all the papers regarding Ireland were focused on animals. Finally, another noteworthy observation is that a large number of articles were a result of international collaboration, with the synergy of China and USA standing out."
                    - figure [ref=f3e545]:
                      - heading "Figure 6." [level=5] [ref=f3e546]
                      - paragraph [ref=f3e547]:
